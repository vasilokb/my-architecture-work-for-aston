# ---------------------------------------------------------------------------
# HTTP / Actuator
# ---------------------------------------------------------------------------
server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ---------------------------------------------------------------------------
# Datasource / Hikari
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:training}?socketTimeout=2
spring.datasource.username=${DB_USER:trainero}
spring.datasource.password=${DB_PASSWORD:change_me_ro_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# пул = сколько слотов исполнения
spring.datasource.hikari.maximum-pool-size=${EXECUTION_DB_POOL_SIZE:4}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000

# ---------------------------------------------------------------------------
# Execution (для trainee-инстанса)
# ---------------------------------------------------------------------------
# если trainee-инстанс — держим лимит
execution.auto-limit=${EXECUTION_AUTO_LIMIT:200}

# ВАЖНО:
# для обучающего сервиса (куда бьёт фронт) → true
# для админского инстанса (отдельный deployment) → поставить в манифесте false
execution.allow-only-select=${EXECUTION_ALLOW_ONLY_SELECT:false}

# общий таймаут (мс), уходит и в наш код, и в statement_timeout
execution.timeout-ms=${EXECUTION_TIMEOUT_MS:1000}


